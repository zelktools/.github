<svg xmlns="http://www.w3.org/2000/svg" width="896" height="446" viewBox="0 0 896 446" font-family="Arial,sans-serif" fill="#fafafa">
  <title>Zelk — stepped cut and offset fit</title>
  <defs>
    <path id="left" d="M1 2h5v5h3v7H1z"/>
    <path id="right" d="M8 2h7v12h-4V5H8z"/>
    <g id="stepped"><use href="#left"/><use href="#right"/></g>
    <g id="offset"><use href="#left" y="1"/><use href="#right" y="-1"/></g>
    <g id="panel">
      <rect width="408" height="306" rx="10" fill="#171717" stroke="#393939"/>
      <path d="M24 211h360" stroke="#393939"/>
      <text x="73" y="270" font-size="30" font-weight="600">Zelk</text>
      <text x="279" y="264" font-size="11" fill="#bbb" font-family="monospace">16 PX</text>
      <rect x="339" y="242" width="32" height="32" rx="6" fill="#171717" stroke="#454545"/>
    </g>
  </defs>
  <rect width="896" height="446" fill="#101010"/>
  <text x="30" y="38" fill="#a8c8cd" font-family="monospace" font-size="14">ZELK / MATCHING PIECES</text>
  <g transform="translate(28 112)">
    <text y="-19" font-size="22">02A / Stepped cut</text><use href="#panel"/>
    <use href="#stepped" transform="translate(132 35) scale(9)"/>
    <use href="#stepped" transform="translate(24 239) scale(2.4)"/>
    <use href="#stepped" x="347" y="250"/>
  </g>
  <g transform="translate(460 112)">
    <text y="-19" font-size="22">02B / Offset fit</text><use href="#panel"/>
    <use href="#offset" transform="translate(132 35) scale(9)"/>
    <use href="#offset" transform="translate(24 239) scale(2.4)"/>
    <use href="#offset" x="347" y="250"/>
  </g>
</svg>
