<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Zelk / Local utilities</title>
  <desc id="desc">The white Offset Fit symbol on a graphite drafting grid, with a blue guide tracing its stepped gap.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#34383e" stroke-width="1"/>
    </pattern>
    <path id="mark" d="M16 48h80v80h48v112H16z M128 16h112v192h-64V64h-48z"/>
    <path id="register" d="M-9 0H9M0-9V9" stroke="#919ba9" fill="none"/>
  </defs>
  <rect width="1920" height="1080" fill="#141618"/>
  <g stroke="#42474e" fill="none"><path d="M96 106H1824M96 968H1824"/></g>
  <g font-family="Consolas, monospace" font-size="17" letter-spacing="3" fill="#b4bcc6">
    <text x="96" y="81">ZELK  /  IDENTITY SERIES</text>
    <text x="1824" y="81" text-anchor="end">PLATE 01</text>
    <text x="96" y="1014">GENERATE   /   VERIFY   /   CONVERT</text>
    <text x="1824" y="1014" text-anchor="end">01 — 01</text>
  </g>
  <rect x="96" y="397" width="42" height="5" fill="#93b4ff"/>
  <text x="90" y="557" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="108" letter-spacing="-5" fill="#f4f5f1">Local security</text>
  <text x="90" y="670" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="108" letter-spacing="-5" fill="#f4f5f1">tools.</text>
  <rect x="980" y="180" width="760" height="720" fill="url(#grid)"/>
  <g fill="none" stroke="#4c535c" stroke-dasharray="4 9">
    <path d="M1020 320H1700M1020 760H1700M1140 220V860M1580 220V860"/>
    <circle cx="1360" cy="540" r="312"/>
  </g>
  <path d="M1320 180V460H1440V900" stroke="#7193d7" fill="none" stroke-width="2"/>
  <use href="#mark" transform="translate(1040 220) scale(2.5)" fill="#f4f5f1"/>
  <g><use href="#register" x="980" y="180"/><use href="#register" x="1740" y="180"/><use href="#register" x="980" y="900"/><use href="#register" x="1740" y="900"/></g>
